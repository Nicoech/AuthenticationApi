version: '3.8'

services:
  authentication-api:
    build:
      context: .
      dockerfile: Dockerfile
    user: root
    container_name: authentication-api
    ports:
      - "5000:8080"
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DB_CONNECTION_STRING=Server=sqlserver_container;Database=INT_Authentication_Database;User Id=SA;Password=@@devcode3231;TrustServerCertificate=True;
      - Keycloak__Authority=http://keycloak:8081/realms/myrealm
      - Keycloak__Audience=authenticationapi
    volumes:
      - ./authentication-api/src:/src
      - data-protection-keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      - database
    networks:
      - app-network
    
    command: [ "sh", "-c", "dotnet ef migrations add InitialCreate --project ./Authentication.Infrastructure/ --startup-project ./Authentication.Api/ && dotnet-ef database update"]
  
  database:
    image: "mcr.microsoft.com/mssql/server:2022-latest"
    container_name: sqlserver_container
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: "@@devcode3231"
      ACCEPT_EULA: "Y"
    networks:
      - app-network
    volumes:
      - ./init-sql/init.sql:/init.sql
    healthcheck:
      test: [ "CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "sqlserver_container", "-U", "SA", "-P", "@@devcode3231", "-Q", "SELECT 1" ]
      interval: 10s
      retries: 10
      start_period: 30s  # Wait longer for SQL Server to start
      
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    ports:
      - "8081:8080"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    volumes:
      - keycloak-data:/opt/keycloak/data
    command: ["start-dev"]
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  data-protection-keys:
  keycloak-data:
    name: keycloak-server
